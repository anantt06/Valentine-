<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Valentine 💗</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg,#ff9a9e,#fad0c4);
  font-family: 'Poppins', sans-serif;
  overflow: hidden;
}

.card {
  background: white;
  padding: 30px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

h2 {
  color: #ff4d6d;
}

button {
  padding: 12px 25px;
  margin: 15px;
  border: none;
  border-radius: 25px;
  font-size: 16px;
  cursor: pointer;
}

#yes {
  background: #ff4d6d;
  color: white;
}

#no {
  background: #ccc;
  position: absolute;
}

#message {
  display: none;
  margin-top: 20px;
  font-size: 18px;
  color: #ff4d6d;
  animation: pop 1s ease forwards;
}

@keyframes pop {
  0% {opacity:0; transform: translateY(20px) scale(0.8);}
  100% {opacity:1; transform: translateY(0) scale(1);}
}

/* hearts animation */
.heart {
  position: absolute;
  font-size: 20px;
  animation: float 3s linear forwards;
}

@keyframes float {
  0% {transform: translateY(0); opacity:1;}
  100% {transform: translateY(-600px); opacity:0;}
}

#shy {
  position: fixed;
  bottom: 20px;
  background: white;
  padding: 8px 15px;
  border-radius: 20px;
  display: none;
}
</style>
</head>

<body>

<div class="card" id="card">
  <h2>Adityi, will you be my Valentine? 💕</h2>
  <button id="yes" onclick="yesClicked()">YES 💗</button>
</div>

<button id="no" onclick="moveNo()">NO 💔</button>

<div id="message">
  I LOVE YOU ❤️  
  YOU MAKE MY WORLD MORE BEAUTIFUL EVERY SINGLE DAY ✨
</div>

<div id="shy">Awww… feeling shy 😳💞</div>

<script>
function yesClicked() {
  document.getElementById("card").style.display="none";
  document.getElementById("no").style.display="none";

  const msg = document.getElementById("message");
  msg.style.display="block";

  for(let i=0;i<25;i++){
    createHeart();
  }
}

function createHeart(){
  const heart = document.createElement("div");
  heart.className="heart";
  heart.innerHTML="💖";
  heart.style.left = Math.random()*100 + "vw";
  heart.style.top = "100vh";
  document.body.appendChild(heart);

  setTimeout(()=>heart.remove(),3000);
}

function moveNo(){
  const no = document.getElementById("no");
  no.style.left = Math.random()*80 + "vw";
  no.style.top = Math.random()*80 + "vh";

  const shy = document.getElementById("shy");
  shy.style.display="block";
  setTimeout(()=>shy.style.display="none",1200);
}
</script>

</body>
</html>
