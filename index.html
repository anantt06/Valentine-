<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Valentine 💗</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ff758c,#ff7eb3);
  font-family:Arial, sans-serif;
  overflow:hidden;
}

.box{
  text-align:center;
  background:rgba(255,255,255,0.2);
  padding:30px;
  border-radius:20px;
}

h1{ color:white; }

button{
  padding:12px 26px;
  font-size:18px;
  border:none;
  border-radius:25px;
  cursor:pointer;
}

#yes{
  background:#ff2e63;
  color:white;
}

#no{
  background:white;
  color:#ff2e63;
  position:fixed;
}

#msg{
  margin-top:20px;
  font-size:22px;
  color:white;
  display:none;
}

/* heart animation */
.heart{
  position:fixed;
  font-size:22px;
  animation:float 4s linear forwards;
}

@keyframes float{
  from{ transform:translateY(0); opacity:1; }
  to{ transform:translateY(-120vh); opacity:0; }
}
</style>
</head>

<body>

<div class="box">
  <h1>Adityi, will you be my Valentine? 💗</h1>
  <button id="yes">Yes 💗</button>
  <button id="no">No 💔</button>
  <div id="msg"></div>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const msg = document.getElementById("msg");

noBtn.onclick = () => {
  const x = Math.random() * (window.innerWidth - 120);
  const y = Math.random() * (window.innerHeight - 60);

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";

  msg.style.display = "block";
  msg.innerText = "Awww feeling shy 🙈";
};

yesBtn.onclick = () => {
  msg.style.display = "block";
  msg.innerText = "I LOVE YOU YOU JUST MADE MY DAY";

  for(let i=0;i<25;i++){
    const h=document.createElement("div");
    h.className="heart";
    h.innerHTML="💗";
    h.style.left=Math.random()*100+"vw";
    h.style.bottom="0";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),4000);
  }
};
</script>

</body>
  </html>
