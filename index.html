<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine 💖</title>

  <style>
    body {
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      text-align: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px 30px;
      border-radius: 22px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
      width: 90%;
      max-width: 420px;
      animation: cardPop 0.8s ease;
    }

    @keyframes cardPop {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    h1 {
      font-size: 26px;
      color: #e6005c;
      margin-bottom: 30px;
    }

    #buttons {
      position: relative;
      height: 160px;
    }

    button {
      padding: 12px 26px;
      font-size: 18px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      position: absolute;
      transition: 0.2s;
    }

    #yes {
      background-color: #ff4da6;
      color: white;
      left: 30%;
      top: 80px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    #no {
      background-color: #888;
      color: white;
      left: 55%;
      top: 80px;
    }

    #message {
      display: none;
      font-size: 18px;
      color: #b30047;
      line-height: 1.6;
      margin-top: 20px;
      animation: fadeIn 0.6s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    #shy {
      display: none;
      font-size: 14px;
      color: #ff4da6;
      margin-top: 10px;
      animation: pop 0.3s ease;
    }

    @keyframes pop {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Adityi, will you be my Valentine? 💌</h1>

    <div id="buttons">
      <button id="yes" onclick="showMessage()">Yes 💗</button>
      <button id="no" onmouseover="moveNo()" onclick="showShy()">No 💔</button>
    </div>

    <div id="shy">Awww… feeling shy 😳💞</div>

    <div id="message">
      I don’t know when it happened,  
      but you slowly became my favourite thought  
      and my safest feeling.  
      <br><br>
      With you, even normal days feel special.  
      I don’t want perfection —  
      I just want **you**, always.  
      <br><br>
      <strong>I love you ❤️</strong>
    </div>
  </div>

  <script>
    function moveNo() {
      const noBtn = document.getElementById("no");
      const x = Math.random() * 220;
      const y = Math.random() * 120;
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    function showShy() {
      const shy = document.getElementById("shy");
      shy.style.display = "block";
      setTimeout(() => {
        shy.style.display = "none";
      }, 1200);
    }

    function showMessage() {
      document.getElementById("buttons").style.display = "none";
      document.getElementById("shy").style.display = "none";
      document.getElementById("message").style.display = "block";
    }
  </script>

</body>
  </html>
